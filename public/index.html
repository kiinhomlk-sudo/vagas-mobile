<body>
  <script>
  async function carregarVagas() {
    const lista = document.getElementById("lista-vagas");

    try {
      const resposta = await fetch("/jobs.json");
      const vagas = await resposta.json();

      lista.innerHTML = vagas.map(vaga => `
        <article>
          <h2>${vaga.title}</h2>
          <p>Empresa: ${vaga.employer}</p>
          <p>Local: ${vaga.location}</p>
          <p>Salário: ${vaga.wage}</p>
        </article>
      `).join("");
    } catch (erro) {
      lista.innerHTML = "<p>Erro ao carregar vagas.</p>";
    }
  }

  carregarVagas();
</script>
</body>

<body>
<main class="app">

<header class="top">
  <h1>Vagas Mobile</h1>

  <div class="sub">
    Busque vagas, consulte os detalhes e prepare seu e-mail.
  </div>

  <nav class="tabs">
    <button id="tabVagas" class="tab active" onclick="changeTab('vagas')">
      Vagas
    </button>

    <button id="tabEnviados" class="tab" onclick="changeTab('enviados')">
      Enviados <span id="sentBadge"></span>
    </button>
  </nav>
</header>

<section id="viewVagas">

  <div class="panel">

    <div class="grid">
      <input
        id="search"
        type="search"
        placeholder="Cargo, empresa ou cidade"
        oninput="renderJobs()"
      >

      <select id="state" onchange="renderJobs()"></select>
    </div>

    <div class="grid3" style="margin-top:9px">

      <select id="type" onchange="renderJobs()">
        <option value="">Todos os tipos</option>
        <option value="H-2A">H-2A</option>
        <option value="H-2B">H-2B</option>
      </select>

      <input
        id="minSalary"
        type="number"
        min="0"
        step="0.01"
        placeholder="Salário mínimo"
        oninput="renderJobs()"
      >

      <input
        id="maxSalary"
        type="number"
        min="0"
        step="0.01"
        placeholder="Salário máximo"
        oninput="renderJobs()"
      >

    </div>

    <div class="sort">
      <span id="resultCount" class="result"></span>

      <select id="sort" onchange="renderJobs()">
        <option value="relevance">Ordenar: relevância</option>
        <option value="salaryDesc">Maior salário</option>
        <option value="salaryAsc">Menor salário</option>
        <option value="newest">Mais recentes</option>
        <option value="title">Título A–Z</option>
      </select>
    </div>

  </div>

  <div id="jobs" class="list"></div>

</section>

<section id="viewEnviados" class="hidden">

  <div class="panel sort">
    <div>
      <b style="font-size:18px">Vagas enviadas</b>
      <div class="result">Histórico salvo neste navegador</div>
    </div>

    <button class="btn danger" onclick="clearSent()">
      Limpar
    </button>
  </div>

  <div id="sentJobs" class="list"></div>

</section>

  Dados fictícios de demonstração. Substitua pelos anúncios oficiais antes de publicar.
</div>

</main>

<div id="toast" class="toast"></div>

<script>
const STORAGE_SENT="vagas_enviadas_v2";
const STORAGE_FAVORITES="vagas_favoritas_v2";

let jobs=[];


const money=value=>"$"+Number(value).toFixed(2)+"/h";

const escapeHTML=value=>String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

function getSent(){
  return JSON.parse(localStorage.getItem(STORAGE_SENT)||"[]");
}

function saveSent(list){
  localStorage.setItem(STORAGE_SENT,JSON.stringify(list));
  updateSentBadge();
}

function getFavorites(){
  return JSON.parse(localStorage.getItem(STORAGE_FAVORITES)||"[]");
}

function showToast(message){
  const toast=document.getElementById("toast");

  toast.textContent=message;
  toast.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    toast.style.display="none";
  },1800);
}

function updateSentBadge(){
  const total=getSent().length;

  document.getElementById("sentBadge").textContent=
    total ? "("+total+")" : "";
}

function changeTab(name){
  document.getElementById("viewVagas")
    .classList.toggle("hidden",name!=="vagas");

  document.getElementById("viewEnviados")
    .classList.toggle("hidden",name!=="enviados");

  document.getElementById("tabVagas")
    .classList.toggle("active",name==="vagas");

  document.getElementById("tabEnviados")
    .classList.toggle("active",name==="enviados");

  if(name==="enviados"){
    renderSentJobs();
  }
}

function createEmail(job){
  const subject="Interest in the "+job.title+" position";

  const body=`Hello,

I am interested in the ${job.title} position at ${job.company}.
Location: ${job.city}, ${job.state}
Employment period: ${job.start} to ${job.end}
Pay range: ${money(job.salaryMin)} to ${money(job.salaryMax)}

Could you please provide me with more information about this job, including the application process, housing, transportation, and requirements?

Thank you for your time.

Best regards.`;

  return{
    subject,
    body,
    complete:
`Email: ${job.email}
Subject: ${subject}
Message:
${body}`
  };
}

function createMailto(job){
  const email=createEmail(job);

  return "mailto:"+encodeURIComponent(job.email)+
    "?subject="+encodeURIComponent(email.subject)+
    "&body="+encodeURIComponent(email.body);
}

function addToSent(job){
  const list=getSent();

  if(!list.some(item=>item.id===job.id)){
    list.unshift({
      ...job,
      sentAt:new Date().toISOString()
    });

    saveSent(list);
    showToast("Vaga adicionada em enviados");
  }
}

async function copyCompleteEmail(job){
  const email=createEmail(job);

  try{
    await navigator.clipboard.writeText(email.complete);
    showToast("E-mail, assunto e mensagem copiados");
  }catch(error){
    showToast("Não foi possível copiar");
  }
}

function toggleFavorite(id){
  let list=getFavorites();

  if(list.includes(id)){
    list=list.filter(item=>item!==id);
  }else{
    list.push(id);
  }

  localStorage.setItem(STORAGE_FAVORITES,JSON.stringify(list));
  renderJobs();
}

function toggleDetails(id){
  document.getElementById("details-"+id)
    .classList.toggle("open");
}

function filteredJobs(){
  const query=document.getElementById("search")
    .value.toLowerCase()
    .trim();

  const state=document.getElementById("state").value;
  const type=document.getElementById("type").value;
  const minimum=Number(document.getElementById("minSalary").value||0);
  const maximum=Number(document.getElementById("maxSalary").value||0);

  const result=jobs.filter(job=>{
    const text=[
      job.title,
      job.company,
      job.city,
      job.state,
      job.type,
      job.description
    ].join(" ").toLowerCase();

    return(
      (!query||text.includes(query))&&
      (!state||job.state===state)&&
      (!type||job.type===type)&&
      (!minimum||job.salaryMax>=minimum)&&
      (!maximum||job.salaryMin<=maximum)
    );
  });

  const sort=document.getElementById("sort").value;

  result.sort((a,b)=>{
    if(sort==="salaryDesc"){
      return b.salaryMax-a.salaryMax;
    }

    if(sort==="salaryAsc"){
      return a.salaryMin-b.salaryMin;
    }

    if(sort==="newest"){
      return new Date(b.posted)-new Date(a.posted);
    }

    if(sort==="title"){
      return a.title.localeCompare(b.title);
    }

    return b.id-a.id;
  });

  return result;
}

function jobCard(job){
  const favorite=getFavorites().includes(job.id);

  return`
  <article class="job">

    <div class="head">
      <div class="badges">
        <span class="badge green">${job.type}</span>
        <span class="badge">${job.state}</span>
        <span class="badge">${escapeHTML(job.city)}</span>
      </div>

      <button
        class="fav ${favorite?"active":""}"
        onclick="toggleFavorite(${job.id})">
        ${favorite?"★":"☆"}
      </button>
    </div>

    <h2 class="title">${escapeHTML(job.title)}</h2>

    <div class="company">
      ${escapeHTML(job.company)}
    </div>

    <div class="meta">
      📍 ${escapeHTML(job.city)}, ${job.state}<br>
      Publicada em ${job.posted}<br>
      ${escapeHTML(job.description)}
    </div>

    <div class="salary">
      <div>
        <span>Faixa salarial</span>
        <strong>${money(job.salaryMin)} – ${money(job.salaryMax)}</strong>
      </div>

      <span>${escapeHTML(job.hours)}</span>
    </div>

    <div class="extra-grid">

      <div class="extra">
        <small>Período</small>
        <b>${job.start} até ${job.end}</b>
      </div>

      <div class="extra">
        <small>Vagas</small>
        <b>${escapeHTML(job.workers)}</b>
      </div>

      <div class="extra">
        <small>Experiência</small>
        <b>${escapeHTML(job.experience)}</b>
      </div>

      <div class="extra">
        <small>E-mail</small>
        <b>${escapeHTML(job.email)}</b>
      </div>

    </div>

    <button
      class="btn muted"
      onclick="toggleDetails(${job.id})">
      Ver todos os detalhes
    </button>

    <div id="details-${job.id}" class="details">
      <h3>Condições da vaga</h3>

      <p><b>Moradia:</b> ${escapeHTML(job.housing)}</p>
      <p><b>Transporte:</b> ${escapeHTML(job.transport)}</p>
      <p><b>Refeições:</b> ${escapeHTML(job.meals)}</p>
      <p><b>Ferramentas:</b> ${escapeHTML(job.tools)}</p>
    </div>

    <div class="actions">

      <a
        class="btn primary"
        href="${createMailto(job)}"
        onclick='addToSent(${JSON.stringify(job)})'>
        Generate email
      </a>

      <button
        class="btn ok"
        onclick='copyCompleteEmail(${JSON.stringify(job)})'>
        Copy email
      </button>

    </div>

  </article>`;
}

function renderJobs(){
  const result=filteredJobs();

  document.getElementById("resultCount").textContent=
    result.length+" vaga(s) encontrada(s)";

  document.getElementById("jobs").innerHTML=result.length
    ? result.map(jobCard).join("")
    : `<div class="empty">Nenhuma vaga encontrada.</div>`;
}

function renderSentJobs(){
  const list=getSent();

  document.getElementById("sentJobs").innerHTML=list.length
    ? list.map(job=>`

      <article class="job">

        <div class="badges">
          <span class="badge green">E-mail preparado</span>
          <span class="badge">${job.type}</span>
          <span class="badge">${job.state}</span>
        </div>

        <h2 class="title">${escapeHTML(job.title)}</h2>

        <div class="company">
          ${escapeHTML(job.company)}
        </div>

        <div class="meta">
          📍 ${escapeHTML(job.city)}, ${job.state}<br>
          Salário: ${money(job.salaryMin)} – ${money(job.salaryMax)}<br>
          Adicionado em:
          ${new Date(job.sentAt).toLocaleString("pt-BR")}
        </div>

        <div class="actions">

          <a
            class="btn primary"
            href="${createMailto(job)}"
            onclick='addToSent(${JSON.stringify(job)})'>
            Open email
          </a>

          <button
            class="btn danger"
            onclick="removeSent(${job.id})">
            Remover
          </button>

        </div>

      </article>
    `).join("")
    : `<div class="empty">Nenhuma vaga enviada ainda.</div>`;
}

function removeSent(id){
  const list=getSent()
    .filter(job=>job.id!==id);

  saveSent(list);
  renderSentJobs();
  showToast("Vaga removida");
}

function clearSent(){
  if(confirm("Limpar todo o histórico de enviados?")){
    saveSent([]);
    renderSentJobs();
    showToast("Histórico limpo");
  }
}

function initialize(){
  const states=[...new Set(jobs.map(job=>job.state))].sort();

  document.getElementById("state").innerHTML=
    `<option value="">Todos os estados</option>`+
    states.map(state=>`<option value="${state}">${state}</option>`).join("");

  updateSentBadge();
  renderJobs();
  renderSentJobs();
}

async function loadJobs(){
  const container=document.getElementById("jobs");

  container.innerHTML=
    `<div class="empty">Carregando vagas atualizadas...</div>`;

  try{
    const response=await fetch(
  "/.netlify/functions/jobs?time="+Date.now()
);

    if(!response.ok){
      throw new Error("jobs.json não encontrado");
    }

    const data=await response.json();

    jobs=Array.isArray(data)
      ? data
      : data.jobs || [];

    updateStateOptions();
    renderJobs();
  }catch(error){
    container.innerHTML=
      `<div class="empty">
        Não foi possível carregar as vagas atualizadas.
        <br><br>
        Aguarde o primeiro processamento do Netlify.
      </div>`;
  }
}

function updateStateOptions(){
  const states=[
    ...new Set(
      jobs
        .map(job=>job.state)
        .filter(Boolean)
    )
  ].sort();

  document.getElementById("state").innerHTML=
    `<option value="">Todos os estados</option>`+
    states.map(state=>
      `<option value="${state}">${state}</option>`
    ).join("");
}
